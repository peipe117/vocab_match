        .card-face-front { 
            transform: rotateY(180deg) translateZ(1px);

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, className }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const mcSoundManager = {
            ctx: null,
            init: function() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            play: function(type) {
                try {
                    if (!this.ctx) this.init();
                    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
                    const t = this.ctx.currentTime;

                    if (type === 'click') {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(320, t);
                        osc.frequency.exponentialRampToValueAtTime(120, t + 0.04);
                        gain.gain.setValueAtTime(0.3, t);
                        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.04);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(t);
                        osc.stop(t + 0.04);

                    } else if (type === 'flip') {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(240, t);
                        osc.frequency.exponentialRampToValueAtTime(420, t + 0.06);
                        gain.gain.setValueAtTime(0.12, t);
                        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.06);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(t);
                        osc.stop(t + 0.06);

                    } else if (type === 'match') {
                        const playOrb = (freq, delay) => {
                            const o = this.ctx.createOscillator();
                            const g = this.ctx.createGain();
                            o.type = 'sine';
                            o.frequency.setValueAtTime(freq, t + delay);
                            o.frequency.exponentialRampToValueAtTime(freq * 1.08, t + delay + 0.15);
                            g.gain.setValueAtTime(0.25, t + delay);
                            g.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.35);
                            o.connect(g);
                            g.connect(this.ctx.destination);
                            o.start(t + delay);
                            o.stop(t + delay + 0.35);
                        };
                        playOrb(880, 0);     // A5
                        playOrb(1174.66, 0.08); // D6

                    } else if (type === 'wrong') {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(160, t);
                        osc.frequency.linearRampToValueAtTime(70, t + 0.15);
                        gain.gain.setValueAtTime(0.28, t);
                        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(t);
                        osc.stop(t + 0.2);

                    } else if (type === 'levelUp') {
                        const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.51];
                        notes.forEach((freq, idx) => {
                            const o = this.ctx.createOscillator();
                            const g = this.ctx.createGain();
                            o.type = 'triangle';
                            o.frequency.setValueAtTime(freq, t + idx * 0.09);
                            g.gain.setValueAtTime(0.25, t + idx * 0.09);
                            g.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.09 + 0.3);
                            o.connect(g);
                            g.connect(this.ctx.destination);
                            o.start(t + idx * 0.09);
                            o.stop(t + idx * 0.09 + 0.3);
                        });
                    }
                } catch (e) {
                    console.error("Audio playback error:", e);
                }
            }
        };

                } else {
                    const info = PINYIN_MAP[char] || { z: char, p: '' };

        function App() {
            const [lang, setLang] = useState('zh');
            const [lessons, setLessons] = useState(DEFAULT_LESSONS);
            const [currentLessonId, setCurrentLessonId] = useState(1);
            const [cards, setCards] = useState([]);
            const [flippedCards, setFlippedCards] = useState([]);
            const [matchedIds, setMatchedIds] = useState([]);
            const [isDisabled, setIsDisabled] = useState(false);
            const [moves, setMoves] = useState(0);
            const [gameWon, setGameWon] = useState(false);
            const [showInstallModal, setShowInstallModal] = useState(false);
            const [showCustomModal, setShowCustomModal] = useState(false);
            const [showDeleteModal, setShowDeleteModal] = useState(false);
            const [editingLesson, setEditingLesson] = useState(null);
            const [shakingCards, setShakingCards] = useState(null);
            const [isVoiceMuted, setIsVoiceMuted] = useState(false); // TTS State

            const t = TRANSLATIONS[lang];

            useEffect(() => {
                if (document.getElementById('busuanzi-script')) return;
                const script = document.createElement('script');
                script.id = 'busuanzi-script';
                script.src = "https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js";
                script.async = true;
                document.body.appendChild(script);
            }, []);

            useEffect(() => {
                const savedLessons = localStorage.getItem('custom_lessons');
                if (savedLessons) {
                    try {
                        const parsed = JSON.parse(savedLessons);
                        setLessons([...DEFAULT_LESSONS, ...parsed]);
                    } catch(e) {
                        console.error(e);
                    }
                }
            }, []);

            useEffect(() => {
                initializeGame();
            }, [currentLessonId, lessons]);

            const currentLesson = useMemo(() => {
                return lessons.find(l => l.id === currentLessonId) || lessons[0];
            }, [lessons, currentLessonId]);

            const totalPairs = useMemo(() => {
                return parseLessonWords(String(currentLesson.words || "")).length;
            }, [currentLesson]);

            const handleSaveCustomLesson = (id, name, words) => {
                let newLessons;
                if (id) {
                    newLessons = lessons.map(l => l.id === id ? { ...l, name, words } : l);
                } else {
                    const newId = Date.now();
                    const newLesson = { id: newId, name: name, words: words, isCustom: true };
                    newLessons = [...lessons, newLesson];
                    setCurrentLessonId(newId);
                }
                setLessons(newLessons);
                const customOnly = newLessons.filter(l => l.isCustom);
                localStorage.setItem('custom_lessons', JSON.stringify(customOnly));
            };

            const performDelete = () => {
                const lessonId = currentLessonId;
                const newLessons = lessons.filter(l => l.id !== lessonId);
                setLessons(newLessons);
                setCurrentLessonId(1);
                const customOnly = newLessons.filter(l => l.isCustom);
                localStorage.setItem('custom_lessons', JSON.stringify(customOnly));
                setShowDeleteModal(false);
            };

            const speakText = (text) => {
                if (isVoiceMuted || !('speechSynthesis' in window)) return;
                if (window.speechSynthesis.state === 'suspended') {
                    window.speechSynthesis.resume();
                }
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'zh-TW'; // Keep reading in Chinese
                msg.rate = 0.85; // Slightly slower for clear learning
                window.speechSynthesis.speak(msg);
            };

            const generateCards = (lessonId) => {
                const targetLesson = lessons.find(l => l.id === lessonId) || lessons[0];
                const parsedWords = parseLessonWords(String(targetLesson.words || ""));
                const cardData = [];
                parsedWords.forEach((item, index) => {
                    const { char, customPinyin } = item;
                    const theme = MC_ORE_THEMES[index % MC_ORE_THEMES.length];
                    
                    cardData.push({ 
                        id: `char-${char}-${index}`, 
                        matchId: index, 
                        type: 'text', 
                        content: char, 
                        baseChar: char, // Used for TTS
                        theme: theme 
                    });

                    let pinyinContent;
                    if (customPinyin) {
                        pinyinContent = customPinyin;
                    } else {
                        const info = PINYIN_MAP[char] || { z: char, p: '' };
                        pinyinContent = info.p ? `${info.z} /${info.p}/` : info.z;
                    }
                    cardData.push({ 
                        id: `pinyin-${char}-${index}`, 
                        matchId: index, 
                        type: 'pinyin',
                        content: pinyinContent, 
                        baseChar: char, // Used for TTS
                        theme: theme 
                    });
                });
                return cardData;
            };

            const shuffleArray = (array) => {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled.map(card => ({ ...card, uniqueId: Math.random().toString(36).substr(2, 9) }));
            };

            const initializeGame = () => {
                const rawCards = generateCards(currentLessonId);
                setCards(shuffleArray(rawCards));
                setFlippedCards([]);
                setMatchedIds([]);
                setMoves(0);
                setGameWon(false);
                setIsDisabled(false);
                setShakingCards(null);
            };

            const handleCardClick = (card) => {
                if (isDisabled || flippedCards.some(f => f.uniqueId === card.uniqueId) || matchedIds.includes(card.matchId)) return;
                
                mcSoundManager.play('flip');
                speakText(card.baseChar); // Read the character when flipped

                const newFlipped = [...flippedCards, { uniqueId: card.uniqueId, matchId: card.matchId }];
                setFlippedCards(newFlipped);

                if (newFlipped.length === 2) {
                    setIsDisabled(true);
                    setMoves(prev => prev + 1);

                    if (newFlipped[0].matchId === newFlipped[1].matchId) {
                        setMatchedIds(prev => {
                            const next = [...prev, card.matchId];
                            mcSoundManager.play('match');

                            if (next.length === totalPairs) {
                                setTimeout(() => {
                                    setGameWon(true);
                                    mcSoundManager.play('levelUp');
                                    confetti({
                                        particleCount: 160,
                                        spread: 80,
                                        colors: ['#55ff55', '#ffff55', '#00aa00', '#55ffff', '#ffaa00'],
                                        origin: { y: 0.6 }
                                    });
                                }, 700);
                            }
                            return next;
                        });
                        setFlippedCards([]);
                        setIsDisabled(false);
                    } else {
                        setTimeout(() => {
                            mcSoundManager.play('wrong');
                            setShakingCards([newFlipped[0].uniqueId, newFlipped[1].uniqueId]);
                            
                            setTimeout(() => {
                                setShakingCards(null);
                                setFlippedCards([]);
                                setIsDisabled(false);
                            }, 500);
                        }, 750);
                    }
                }
            };

            const gridClass = cards.length <= 16 
                ? "grid-cols-2 sm:grid-cols-4 max-w-4xl" 
                : cards.length <= 20 
                    ? "grid-cols-2 sm:grid-cols-4 md:grid-cols-5 max-w-5xl" 
                    : "grid-cols-2 sm:grid-cols-3 md:grid-cols-6 max-w-6xl";

            const xpPercentage = totalPairs > 0 ? (matchedIds.length / totalPairs) * 100 : 0;

            return (
                <div className="min-h-screen flex flex-col items-center">
                    <div className="hidden print-only">
                        <PrintLayout lesson={currentLesson} lang={lang} />
                    </div>

                    <div className="w-full flex flex-col items-center py-4 px-3 md:px-6 pb-20 no-print max-w-6xl">
                        
                        <header className="w-full flex flex-col items-center my-3 md:my-5">
                            <div className="flex items-center gap-2 px-3 py-1 bg-stone-900 border-2 border-stone-600 rounded-none shadow-md mb-2">
                                <span className="inline-block w-3 h-3 bg-green-500 animate-pulse"></span>
                                <span className="text-xs font-mono text-stone-300 tracking-wider">{t.subtitle}</span>
                            </div>
                            
                            <div className="relative flex items-center justify-center">
                                <h1 className="text-3xl md:text-5xl font-black font-pixel tracking-wider text-amber-300 drop-shadow-[0_4px_0_#422006] select-none text-center">
                                    {t.title}
                                </h1>
                            </div>
                        </header>

                        <div className="w-full max-w-4xl mc-panel p-4 md:p-5 mb-6 text-stone-900">
                            <div className="flex flex-col md:flex-row gap-4 items-center justify-between">
                                
                                <div className="w-full md:w-72">
                                    <label className="block text-xs font-black text-stone-800 tracking-widest uppercase mb-1">
                                        {t.adventureMap}
                                    </label>
                                    <div className="flex gap-1.5">
                                        <div className="relative flex-1">
                                            <select 
                                                value={currentLessonId}
                                                onChange={(e) => {
                                                    mcSoundManager.play('click');
                                                    setCurrentLessonId(Number(e.target.value));
                                                }}
                                                className="w-full appearance-none bg-stone-200 border-2 border-black text-stone-900 font-bold py-2.5 px-3 pr-8 focus:outline-none focus:bg-white text-sm cursor-pointer shadow-inner"
                                            >
                                                {lessons.map(lesson => {
                                                    const displayName = lesson.isCustom ? lesson.name : (lang === 'zh' ? lesson.nameZh : lesson.nameEn);
                                                    return (
                                                        <option key={lesson.id} value={lesson.id}>
                                                            {displayName} {lesson.isCustom ? t.customTag : ''}
                                                        </option>
                                                    );
                                                })}
                                            </select>
                                            <span className="absolute right-2.5 top-1/2 -translate-y-1/2 text-black pointer-events-none text-xs">▼</span>
                                        </div>
                                        <button 
                                            onClick={() => { mcSoundManager.play('click'); setEditingLesson(null); setShowCustomModal(true); }} 
                                            className="mc-btn px-3 text-white font-bold text-sm" 
                                            title="Add Custom Lesson">
                                            ＋
                                        </button>
                                        {currentLesson.isCustom && (
                                            <>
                                                <button 
                                                    onClick={() => { mcSoundManager.play('click'); setEditingLesson(currentLesson); setShowCustomModal(true); }} 
                                                    className="mc-btn px-2.5 text-amber-300 font-bold text-sm" 
                                                    title="Edit Lesson">
                                                    ✏️
                                                </button>
                                                <button 
                                                    onClick={() => { mcSoundManager.play('click'); setShowDeleteModal(true); }} 
                                                    className="mc-btn-red px-2.5 text-white font-bold text-sm" 
                                                    title="Delete Lesson">
                                                    🗑️
                                                </button>
                                            </>
                                        )}
                                    </div>
                                </div>

                                <div className="flex flex-wrap items-center justify-between md:justify-end gap-3 w-full md:w-auto">
                                    
                                    <button 
                                        onClick={() => { mcSoundManager.play('click'); setLang(lang === 'zh' ? 'en' : 'zh'); }}
                                        className="flex items-center gap-1 bg-sky-200 border-2 border-black px-3 py-1.5 shadow-inner mc-btn cursor-pointer"
                                        title="Switch Language"
                                    >
                                        <span className="text-xs font-black text-stone-800">🌐 {lang === 'zh' ? 'EN' : '中'}</span>
                                    </button>

                                    <button 
                                        onClick={() => { mcSoundManager.play('click'); setIsVoiceMuted(!isVoiceMuted); }}
                                        className="flex items-center gap-1 bg-stone-300 border-2 border-black px-3 py-1.5 shadow-inner mc-btn cursor-pointer"
                                        title="Toggle Voice"
                                    >
                                        <span className="text-xs font-black text-stone-800">{isVoiceMuted ? t.voiceMuted : t.voiceOn}</span>
                                    </button>

                                    <div className="flex items-center gap-2 bg-stone-300 border-2 border-black px-3 py-1.5 shadow-inner">
                                        <span className="text-xs font-black text-stone-800">{t.moves}</span>
                                        <span className="font-pixel text-base font-black text-black">{moves}</span>
                                    </div>

                                    <button 
                                        onClick={() => { mcSoundManager.play('click'); initializeGame(); }} 
                                        className="mc-btn px-4 py-2 text-white font-bold tracking-wider text-sm flex items-center gap-1.5">
                                        <span>🔄</span>
                                        <span>{t.restart}</span>
                                    </button>
                                </div>
                            </div>

                            <div className="mt-4 pt-3 border-t-2 border-stone-400">
                                <div className="flex justify-between items-center text-xs font-black mb-1 text-stone-800">
                                    <div className="flex items-center gap-1">
                                        <span className="text-lime-700">❇️</span>
                                        <span>{t.miningProgress}</span>
                                    </div>
                                    <div className="font-pixel text-[11px] text-lime-800 font-black">
                                        {matchedIds.length} / {totalPairs} {t.ores}
                                    </div>
                                </div>
                                <div className="w-full h-4 xp-bar-bg relative flex items-center">
                                    <div 
                                        className="h-full xp-bar-fill transition-all duration-300"
                                        style={{ width: `${xpPercentage}%` }}
                                    ></div>
                                    <div className="absolute inset-0 flex items-center justify-center font-pixel text-[10px] text-white tracking-widest mc-text-shadow font-black">
                                        LV.{matchedIds.length}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className={`grid ${gridClass} gap-3 md:gap-4 w-full place-items-center mb-8`}>
                            {cards.map((card) => {
                                const isFlipped = flippedCards.some(f => f.uniqueId === card.uniqueId);
                                const isMatched = matchedIds.includes(card.matchId);
                                const isShaking = shakingCards && shakingCards.includes(card.uniqueId);

                                return (
                                    <div 
                                        key={card.uniqueId} 
                                        className={`relative w-full h-32 sm:h-36 md:h-40 cursor-pointer perspective-1000 transition-all duration-500 ${
                                            isMatched 
                                                ? 'opacity-0 scale-75 pointer-events-none' 
                                                : 'opacity-100 scale-100'
                                        } ${isShaking ? 'animate-mc-hurt' : ''}`}
                                        onClick={() => handleCardClick(card)}
                                    >
                                        <div className={`w-full h-full transition-transform duration-300 transform-style-3d relative ${isFlipped ? 'rotate-y-180' : ''}`}>
                                            
                                            <div className="card-face card-face-back card-grass-block flex flex-col items-center justify-center p-2">
                                                <div className="w-10 h-10 md:w-12 md:h-12 bg-black/40 border-2 border-black flex items-center justify-center shadow-inner">
                                                    <span className="font-pixel text-amber-300 text-lg md:text-xl font-black drop-shadow-[0_2px_0_#000]">?</span>
                                                </div>
                                                <span className="text-[10px] font-mono text-stone-200 mt-2 font-bold tracking-widest drop-shadow-[0_1px_0_#000]">MINE</span>
                                            </div>

                                            <div className={`card-face card-face-front flex flex-col items-center justify-center p-2 text-center shadow-inner ${card.theme}`}>
                                                <div className="bg-black/60 border-2 border-black w-full h-full flex flex-col items-center justify-center p-2 rounded-none relative">
                                                    
                                                    {/* Voice Replay Button */}
                                                    <button
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            mcSoundManager.play('click');
                                                            speakText(card.baseChar);
                                                        }}
                                                        className="absolute top-1 right-1 w-6 h-6 md:w-7 md:h-7 bg-black/40 hover:bg-black/80 border-2 border-black flex items-center justify-center text-xs text-white shadow-inner transition-colors z-10"
                                                        title="Read Aloud"
                                                    >
                                                        🔊
                                                    </button>

                                                    {card.type === 'text' ? (
                                                        <span className="text-4xl md:text-5xl font-black text-white drop-shadow-[0_2px_0_#000] tracking-wider mt-2">
                                                            {card.content}
                                                        </span>
                                                    ) : (
                                                        <span className="text-lg md:text-xl font-black text-amber-200 text-center leading-snug drop-shadow-[0_2px_0_#000] mt-2">
                                                            {card.content}
                                                        </span>
                                                    )}
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        <footer className="w-full max-w-md mx-auto mt-4 text-center">
                            <div className="grid grid-cols-3 gap-3 mb-5">
                                <button 
                                    onClick={() => { mcSoundManager.play('click'); window.print(); }} 
                                    className="mc-btn py-2.5 px-2 flex flex-col items-center justify-center text-white text-[10px] md:text-xs font-bold gap-1">
                                    <span className="text-lg">📜</span>
                                    <span>{t.printScroll}</span>
                                </button>
                                <button 
                                    onClick={() => { mcSoundManager.play('click'); setShowInstallModal(true); }} 
                                    className="mc-btn py-2.5 px-2 flex flex-col items-center justify-center text-white text-[10px] md:text-xs font-bold gap-1">
                                    <span className="text-lg">📲</span>
                                    <span>{t.addToHotbar}</span>
                                </button>
                                <div className="mc-panel-dark py-2.5 px-2 flex flex-col items-center justify-center text-stone-300 text-[10px] md:text-xs font-bold gap-1">
                                    <span className="text-lg">🗡️</span>
                                    <span>Sophia Wong</span>
                                </div>
                            </div>
                            
                            <div className="text-[11px] font-mono text-stone-400">
                                <span id="busuanzi_container_site_uv">
                                    {t.serverAdventurers} <span id="busuanzi_value_site_uv" className="font-bold text-amber-400">...</span>
                                </span>
                            </div>
                        </footer>

                        {gameWon && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-xs">
                                <div className="mc-panel p-6 md:p-8 max-w-md w-full text-center relative border-4 border-black">
                                    <div className="flex justify-center mb-3">
                                        <div className="w-16 h-16 bg-amber-400 border-2 border-black flex items-center justify-center text-4xl shadow-md">
                                            🏆
                                        </div>
                                    </div>
                                    <h2 className="text-2xl md:text-3xl font-black font-pixel text-amber-800 mb-2 drop-shadow-sm">
                                        {t.achievementGet}
                                    </h2>
                                    <p className="font-bold text-stone-900 text-base mb-1">
                                        {t.vocabMaster}
                                    </p>
                                    <p className="text-stone-700 text-sm mb-6 leading-relaxed">
                                        {t.winMessage1} <br/>
                                        <span className="font-black text-black">"{currentLesson.isCustom ? currentLesson.name : (lang === 'zh' ? currentLesson.nameZh : currentLesson.nameEn)}"</span>!<br/>
                                        {t.winMessage2} <span className="font-pixel text-amber-900 text-lg font-black">{moves}</span>.
                                    </p>
                                    <button 
                                        onClick={() => { mcSoundManager.play('click'); initializeGame(); }} 
                                        className="mc-btn-green w-full text-white font-pixel text-xs py-4 shadow-xl tracking-wider">
                                        {t.startAnother}
                                    </button>
                                </div>
                            </div>
                        )}

                        {showInstallModal && <InstallGuideModal onClose={() => setShowInstallModal(false)} lang={lang} />}
                        {showCustomModal && (
                            <CustomLessonModal 
                                onClose={() => setShowCustomModal(false)} 
                                onSave={handleSaveCustomLesson} 
                                initialData={editingLesson}
                                lang={lang}
                            />
                        )}
                        {showDeleteModal && (
                            <DeleteConfirmModal 
                                onClose={() => setShowDeleteModal(false)} 
                                onConfirm={performDelete} 
                                lang={lang}
                            />
                        )}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
